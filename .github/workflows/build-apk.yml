name: Build AlSharq Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AlSharq-Android-Studio-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Android SDK
      # لا تستخدم sdkmanager tools لأنه يسبب الخطأ السابق
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. قبول الرخص وتثبيت الحزم المطلوبة
      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # 5. التأكد من وجود ملف المشروع المضغوط
      - name: Check project ZIP
        shell: bash
        run: |
          if [ ! -f "AlSharq-Android-Studio-Project.zip" ]; then
            echo "::error::لم يتم العثور على AlSharq-Android-Studio-Project.zip في جذر المستودع."
            echo "تأكد من وجود الملف في الصفحة الرئيسية للمستودع."
            exit 1
          fi

          echo "تم العثور على ملف المشروع."

      # 6. فك ضغط المشروع
      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          unzip -o AlSharq-Android-Studio-Project.zip -d extracted

          echo "ملفات المشروع:"
          find extracted -maxdepth 4 -type f | head -100

      # 7. العثور على مشروع Android
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS="$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::لم يتم العثور على settings.gradle أو settings.gradle.kts داخل الملف المضغوط."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::لم يتم العثور على ملف بناء وحدة app."
            echo "مجلد المشروع: $PROJECT_DIR"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "تم العثور على المشروع: $PROJECT_DIR"

      # 8. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 9. بناء APK
      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "::error::المشروع لا يحتوي على gradlew. لن نستخدم إصدار Gradle عشوائيًا."
            echo "يجب التأكد من ملفات Gradle المرفقة بالمشروع."
            exit 1
          fi

      # 10. جمع ملفات APK
      - name: Collect APK files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if ! find "$GITHUB_WORKSPACE/apk-output" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::انتهى البناء دون العثور على ملف APK."
            exit 1
          fi

          echo "ملفات APK الناتجة:"
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      # 11. إتاحة APK للتحميل
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlSharq-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7

## الخطوة الثالثة: احفظ الملف

بعد لصق الكود:

1. اضغط **Commit changes**.
2. أكّد الحفظ إذا ظهرت نافذة أخرى.
3. افتح تبويب **Actions** في المستودع.
4. اختر **Build AlSharq Android APK**.
5. افتح عملية البناء الجديدة وانتظر النتيجة.

## الخطوة الرابعة: إذا نجح البناء

ستظهر علامة خضراء ✅. افتح صفحة العملية، وانزل إلى قسم **Artifacts**، ثم اضغط `AlSharq-APK` لتنزيل ملف التطبيق.

إذا فشل البناء، افتح الخطوة الحمراء وأرسل لي رسالة الخطأ الجديدة.

**ملاحظة مهمة:** الكود الجديد يتجنب استدعاء `sdkmanager tools` الذي ظهر في السجل السابق، لكنه يتطلب وجود ملف `gradlew` داخل المشروع المضغوط. كما أن نجاح البناء يعتمد على توافق إعدادات Gradle وAndroid SDK مع ملفات المشروع. لا تحذف ملف ZIP الأصلي من المستودع.