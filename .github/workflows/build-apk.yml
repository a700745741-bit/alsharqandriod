name: Build AlSharq Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AlSharq-Android-Studio-Project.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK Manually
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q commandlinetools-linux-12266719_latest.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o AlSharq-Android-Studio-Project.zip -d extracted
      - name: Locate project
        id: locate
        run: |
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew || true
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find app/build/outputs/apk -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
      - uses: actions/upload-artifact@v4
        with:
          name: AlSharq-APK
          path: apk-output/*.apk
          retention-days: 7