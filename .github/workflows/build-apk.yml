name: Build AlSharq Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AlSharq-Android-Studio-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o AlSharq-Android-Studio-Project.zip -d extracted
          echo "Files extracted:"
          find extracted -maxdepth 3 -type f | head -80

      - name: Locate project and build APK
        shell: bash
        run: |
          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: AlSharq-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7