<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى العندليب - دوري تحدي التوقعات</title>
    <!-- استدعاء مكتبة قراءة الصور -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <!-- استدعاء مكتبة تحويل الجدول إلى صورة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary-bg: #0a192f;
            --secondary-bg: #112240;
            --gold: #ffd700;
            --text-light: #e6f1ff;
            --green: #28a745;
            --red: #dc3545;
            --blue: #007bff;
            --purple: #6f42c1;
            --orange: #fd7e14;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--secondary-bg);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        h1, h2, h3 { text-align: center; color: var(--gold); }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin: 5px;
            transition: 0.3s;
        }
        .btn-gold { background-color: var(--gold); color: #000; }
        .btn-green { background-color: var(--green); color: #fff; }
        .btn-red { background-color: var(--red); color: #fff; }
        .btn-blue { background-color: var(--blue); color: #fff; }
        .btn-purple { background-color: var(--purple); color: #fff; }
        .btn-orange { background-color: var(--orange); color: #fff; }
        .btn:hover { opacity: 0.8; }
        
        .control-group {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        input[type="text"], input[type="number"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { height: 80px; resize: vertical; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .flex-row > input { flex: 1; min-width: 80px; }

        /* تصميم الجدول */
        .table-container { 
            overflow-x: auto; 
            margin-top: 15px; 
            background-color: var(--primary-bg); 
            border: 1px solid var(--gold);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: var(--primary-bg);
            color: #fff;
        }
        th { 
            background-color: var(--secondary-bg); 
            color: var(--gold); 
            padding: 12px; 
            border-bottom: 2px solid var(--gold); 
            font-size: 16px;
        }
        td { 
            padding: 10px; 
            border-bottom: 1px solid #233554; 
            font-weight: bold; 
            font-size: 15px;
            vertical-align: middle;
        }
        
        /* أعمدة الجدول */
        .col-rank { text-align: center; width: 10%; color: var(--gold); font-size: 18px;}
        .col-name { text-align: right; padding-right: 15px; width: 50%; }
        .col-points { text-align: center; width: 15%; font-size: 18px; color: #fff;}
        .col-actions { text-align: center; width: 25%; display: flex; justify-content: center; gap: 5px;}
        
        /* أزرار الإجراءات */
        .action-btn { 
            border: none; 
            border-radius: 8px; 
            width: 35px; 
            height: 35px; 
            font-size: 18px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .edit-btn { background-color: var(--blue); }
        .delete-btn { background-color: var(--red); }
        
        #loading { display: none; text-align: center; color: var(--gold); font-weight: bold; margin-top: 10px; }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .col-actions-hide { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>صدى العندليب</h1>
    <h3>دوري تحدي التوقعات ⭐</h3>

    <!-- القسم الجديد: فرز التوقعات الصحيحة -->
    <div class="control-group" style="border-color: var(--green); background: rgba(40, 167, 69, 0.1);">
        <h3 style="color: var(--green);">✅ فرز التوقعات الصحيحة</h3>
        <p style="font-size: 12px; text-align: center;">الصق أسماء الفائزين هنا (كل اسم في سطر مستقل)</p>
        <textarea id="correctGuessNames" placeholder="الاسم الأول&#10;الاسم الثاني&#10;الاسم الثالث..."></textarea>
        <div class="flex-row" style="margin-top: 10px;">
            <input type="number" id="pointsToAdd" placeholder="عدد النقاط" value="3" style="width: 100px;">
            <button class="btn btn-green" style="flex: 1;" onclick="processCorrectGuesses()">إضافة النقاط وفرز الجدول 🔄</button>
        </div>
    </div>

    <!-- إضافة اسم واحد (يدوي) -->
    <div class="control-group">
        <h3>إضافة اسم واحد (يدوي)</h3>
        <div class="flex-row">
            <input type="text" id="singleName" placeholder="اكتب اسم المشترك">
            <input type="number" id="singlePoints" placeholder="النقاط" value="0">
            <button class="btn btn-gold" onclick="addSingleName()">إضافة</button>
        </div>
    </div>

    <!-- استيراد صورة -->
    <div class="control-group">
        <h3>📅 استيراد كشف من صورة</h3>
        <input type="file" id="imageUpload" accept="image/*">
        <button class="btn btn-blue" style="width: 100%; margin-top: 10px;" onclick="processImage()">استيراد وقراءة الكشف</button>
        <div id="loading">جاري قراءة الصورة... يرجى الانتظار ⏳</div>
    </div>

    <!-- أزرار المشاركة والمسح -->
    <div class="control-group" style="text-align: center; border-color: var(--purple);">
        <h3 style="color: var(--purple);">مشاركة النتائج</h3>
        <div class="share-buttons">
            <button class="btn btn-purple" onclick="shareText()">📱 مشاركة النص (واتساب)</button>
            <button class="btn btn-blue" onclick="shareImage()">🖼️ حفظ الجدول كصورة</button>
            <button class="btn btn-red" onclick="clearAll()">🗑️ مسح الكل</button>
        </div>
    </div>

    <!-- الجدول -->
    <div id="captureArea">
        <h3 style="color: var(--gold);">الترتيب التلقائي (من الأعلى للأقل نقاطاً)</h3>
        <div class="table-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-name">الاسم</th>
                        <th class="col-points">النقاط</th>
                        <th class="col-actions">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- سيتم تعبئة البيانات هنا -->
                </tbody>
            </table>
        </div>
        <h3 id="totalCount" style="margin-top: 20px; background: var(--primary-bg); padding: 10px; border-radius: 8px;">إجمالي المشاركين: 0</h3>
    </div>
</div>

<script>
    // مصفوفة البيانات
    let players = JSON.parse(localStorage.getItem('sharqPlayers')) || [];

    // دالة الحفظ التلقائي
    function autoSave() {
        localStorage.setItem('sharqPlayers', JSON.stringify(players));
    }

    // دالة عرض الجدول مع الترتيب التلقائي
    function renderTable() {
        // الترتيب التنازلي حسب النقاط
        players.sort((a, b) => b.points - a.points);
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        players.forEach((player, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-rank">${index + 1}</td>
                <td class="col-name">${player.name}</td>
                <td class="col-points">${player.points}</td>
                <td class="col-actions">
                    <button class="action-btn edit-btn" onclick="editPlayer('${player.name}')" title="تعديل">✏️</button>
                    <button class="action-btn delete-btn" onclick="deletePlayer('${player.name}')" title="حذف">✖</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        document.getElementById('totalCount').innerText = `إجمالي المشاركين: ${players.length}`;
        autoSave();
    }

    // دالة تعديل الاسم والنقاط
    function editPlayer(oldName) {
        const player = players.find(p => p.name === oldName);
        if (!player) return;

        // نافذة إدخال للاسم الجديد
        const newName = prompt('تعديل الاسم:', player.name);
        if (newName === null) return; // إذا ضغط إلغاء

        // نافذة إدخال للنقاط الجديدة
        const newPointsStr = prompt('تعديل النقاط:', player.points);
        if (newPointsStr === null) return; // إذا ضغط إلغاء

        const newPoints = parseInt(newPointsStr);
        if (isNaN(newPoints)) {
            alert('الرجاء إدخال رقم صحيح للنقاط.');
            return;
        }

        // تحديث البيانات
        if (newName.trim() !== "") {
            player.name = newName.trim();
        }
        player.points = newPoints;

        // إعادة ترتيب وعرض الجدول
        renderTable();
    }

    // دالة معالجة التوقعات الصحيحة (الجماعية)
    function processCorrectGuesses() {
        const text = document.getElementById('correctGuessNames').value;
        const points = parseInt(document.getElementById('pointsToAdd').value) || 0;
        
        if (!text.trim()) {
            alert('يرجى لصق أسماء الفائزين أولاً.');
            return;
        }

        const names = text.split('\n').map(n => n.trim()).filter(n => n !== '');
        let newAdded = 0;
        let updated = 0;

        names.forEach(name => {
            const existingPlayer = players.find(p => p.name === name);
            if (existingPlayer) {
                existingPlayer.points += points; // إضافة نقاط لاسم موجود
                updated++;
            } else {
                players.push({ name: name, points: points }); // إضافة اسم جديد
                newAdded++;
            }
        });

        document.getElementById('correctGuessNames').value = '';
        renderTable(); // الترتيب التلقائي يحدث هنا
        
        alert(`تمت الإضافة والترتيب!\n✅ أسماء جديدة: ${newAdded}\n🔄 تم تحديث نقاط: ${updated}`);
    }

    // إضافة اسم واحد يدوياً
    function addSingleName() {
        const nameInput = document.getElementById('singleName');
        const pointsInput = document.getElementById('singlePoints');
        
        const name = nameInput.value.trim();
        const points = parseInt(pointsInput.value) || 0;
        
        if (name) {
            const existing = players.find(p => p.name === name);
            if (existing) {
                existing.points += points;
            } else {
                players.push({ name: name, points: points });
            }
            nameInput.value = '';
            pointsInput.value = '0';
            renderTable(); // الترتيب التلقائي
        } else {
            alert('يرجى كتابة الاسم أولاً');
        }
    }

    // حذف لاعب
    function deletePlayer(name) {
        if(confirm(`هل أنت متأكد من حذف (${name})؟`)) {
            players = players.filter(p => p.name !== name);
            renderTable(); // الترتيب التلقائي
        }
    }

    // مسح الكل
    function clearAll() {
        if(confirm('هل أنت متأكد من مسح جميع الأسماء والبيانات؟')) {
            players = [];
            renderTable();
        }
    }

    // مشاركة النص عبر الواتساب
    function shareText() {
        if(players.length === 0) { alert('لا توجد بيانات.'); return; }
        
        let text = "🏆 *ترتيب دوري تحدي التوقعات* 🏆\n";
        text += "صدى العندليب - معاً نحو القمة ⭐\n\n";
        
        players.forEach((player, index) => {
            let medal = index === 0 ? "🥇 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : `${index + 1}- `;
            text += `${medal}${player.name} : *${player.points}* نقطة\n`;
        });
        text += `\n👥 إجمالي المشاركين: ${players.length}`;

        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // حفظ الجدول كصورة
    function shareImage() {
        if(players.length === 0) { alert('لا توجد بيانات.'); return; }

        const captureArea = document.getElementById('captureArea');
        // إخفاء أزرار التعديل والحذف قبل التصوير
        const actionCols = document.querySelectorAll('.col-actions');
        actionCols.forEach(col => col.classList.add('col-actions-hide'));

        html2canvas(captureArea, {
            backgroundColor: "#0a192f",
            scale: 2
        }).then(canvas => {
            actionCols.forEach(col => col.classList.remove('col-actions-hide'));
            const link = document.createElement('a');
            link.download = 'ترتيب_صدى_العندليب.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }).catch(err => {
            console.error(err);
            actionCols.forEach(col => col.classList.remove('col-actions-hide'));
        });
    }

    // استيراد من صورة
    async function processImage() {
        const fileInput = document.getElementById('imageUpload');
        if (!fileInput.files.length) { alert('اختر صورة أولاً.'); return; }

        document.getElementById('loading').style.display = 'block';

        try {
            const worker = await Tesseract.createWorker('ara', 1);
            const ret = await worker.recognize(fileInput.files[0]);
            await worker.terminate();
            
            const lines = ret.data.text.split('\n');
            
            lines.forEach(line => {
                let cleanLine = line.replace(/[^\u0600-\u06FF0-9\s]/g, '').trim();
                if (!cleanLine) return;

                const numbers = cleanLine.match(/\d+/g);
                if (numbers) {
                    let namePart = cleanLine.replace(/\d+/g, '').trim().replace(/\s+/g, ' ');
                    if (namePart.length > 2) { 
                        let numsArray = numbers.map(Number).sort((a, b) => a - b);
                        let points = numsArray.length >= 2 ? numsArray[numsArray.length - 1] : numsArray[0];

                        const existing = players.find(p => p.name === namePart);
                        if (!existing) {
                            players.push({ name: namePart, points: points });
                        } else {
                            existing.points += points; 
                        }
                    }
                }
            });

            renderTable(); // الترتيب التلقائي
            alert('تم استيراد البيانات وترتيبها تلقائياً.');

        } catch (error) {
            alert('حدث خطأ أثناء قراءة الصورة.');
        } finally {
            document.getElementById('loading').style.display = 'none';
            fileInput.value = ''; 
        }
    }

    document.addEventListener('DOMContentLoaded', renderTable);
</script>
</body>
</html>
