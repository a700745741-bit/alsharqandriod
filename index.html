<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى العندليب - الترتيب النهائي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* المتغيرات الافتراضية */
        :root {
            --bg-page: #0a192f;
            --bg-table: #112240;
            --bg-row: #0a192f;
            --bg-points: #ffd700;
            --text-main: #ffffff;
            --border-main: #ffd700;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-table);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--border-main);
        }
        h1, h2, h3 { text-align: center; color: var(--border-main); margin-top: 5px; }
        
        .box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-main);
        }

        /* تنسيق الأزرار */
        .btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            width: 100%;
            margin-top: 5px;
        }
        .btn-green { background-color: #28a745; }
        .btn-gold { background-color: #ffd700; color: #000; }
        .btn-blue { background-color: #007bff; }
        .btn-red { background-color: #dc3545; }
        .btn-orange { background-color: #fd7e14; }
        .btn-purple { background-color: #6f42c1; }

        /* حقول الإدخال */
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .flex-row { display: flex; gap: 5px; }
        .flex-row input { flex: 1; }

        /* لوحة الألوان */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .color-box {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .color-box label { display: block; font-size: 12px; margin-bottom: 5px; }
        .color-box input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; }

        /* تصميم الجدول */
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: var(--bg-table);
            border: 1px solid var(--border-main);
        }
        th { 
            background-color: var(--bg-table); 
            color: var(--border-main); 
            padding: 10px; 
            border-bottom: 2px solid var(--border-main); 
            font-size: 16px;
        }
        td { 
            padding: 5px; 
            border-bottom: 1px solid var(--border-main); 
            font-weight: bold; 
            background-color: var(--bg-row);
            color: var(--text-main);
        }
        
        /* حقول التعديل المباشرة */
        .edit-input {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            font-family: inherit;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            padding: 8px 2px;
            margin: 0;
            box-sizing: border-box;
            outline: none;
            border-radius: 5px;
        }
        .edit-input:focus {
            border-color: var(--border-main);
            background: rgba(255,255,255,0.1);
        }
        .name-input { text-align: right; font-size: 16px; }
        .points-input {
            background-color: var(--bg-points);
            color: #000;
            font-size: 18px;
            text-align: center;
            font-weight: 900;
            border-radius: 8px;
        }

        /* تصميم قائمة الفرز */
        .parsed-list {
            max-height: 250px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            display: none;
        }
        .parsed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #333;
        }
        .parsed-item:last-child { border-bottom: none; }
        .parsed-item input {
            width: 80px;
            padding: 5px;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        
        /* زر الحذف */
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>صدى العندليب</h1>

    <!-- لوحة التحكم بالألوان -->
    <div class="box" style="border-color: var(--btn-purple);">
        <h3 style="color: var(--btn-purple);">🎨 تغيير الألوان</h3>
        <div class="color-grid">
            <div class="color-box"><label>خلفية الصفحة</label><input type="color" id="c-page" onchange="changeColor('bg-page', this.value)"></div>
            <div class="color-box"><label>خلفية الجدول</label><input type="color" id="c-table" onchange="changeColor('bg-table', this.value)"></div>
            <div class="color-box"><label>خلفية الصفوف</label><input type="color" id="c-row" onchange="changeColor('bg-row', this.value)"></div>
            <div class="color-box"><label>مربع النقاط</label><input type="color" id="c-points" onchange="changeColor('bg-points', this.value)"></div>
        </div>
    </div>

    <!-- نظام الفرز والإضافة الذكي -->
    <div class="box" style="border-color: var(--btn-orange);">
        <h3 style="color: var(--btn-orange);">📋 إضافة توقعات صحيحة (لصق)</h3>
        <textarea id="bulkNames" placeholder="الصق الأسماء هنا (مفصولة بفاصلة أو سطر)..."></textarea>
        <button class="btn btn-orange" onclick="parseNames()">🔍 فرز الأسماء</button>

        <div id="parsedContainer" class="parsed-list">
            <h4 style="margin-top: 0; text-align: center; color: var(--border-main);">الأسماء المكتشفة:</h4>
            <div id="parsedItems"></div>
            <div class="flex-row" style="margin-top: 10px;">
                <input type="number" id="defaultPoints" placeholder="النقاط الافتراضية" value="3" style="flex: 1;">
                <button class="btn btn-green" onclick="applyParsedNames()">✅ إضافة للجدول</button>
            </div>
        </div>
    </div>

    <!-- إضافة اسم واحد -->
    <div class="box">
        <h3>➕ إضافة اسم ونقاط (يدوي)</h3>
        <div class="flex-row">
            <input type="text" id="inputName" placeholder="اسم المشترك">
            <input type="number" id="inputPoints" placeholder="النقاط" value="0">
        </div>
        <button class="btn btn-gold" onclick="addName()">إضافة مباشرة</button>
    </div>

    <!-- أزرار التحكم الرئيسية -->
    <div class="box" style="text-align: center;">
        <button class="btn btn-green" style="margin-bottom: 5px;" onclick="saveData(true)">💾 حفظ التعديلات</button>
        <button class="btn btn-blue" style="margin-bottom: 5px;" onclick="shareWhatsApp()">📱 مشاركة عبر واتساب</button>
        <button class="btn btn-red" style="margin-bottom: 5px;" onclick="resetPoints()">🔄 تصفير جميع النقاط</button>
        <button class="btn btn-red" onclick="clearAll()">🗑️ مسح جميع الأسماء</button>
    </div>

    <!-- الجدول الرئيسي -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">#</th>
                    <th style="width: 40%;">الاسم</th>
                    <th style="width: 25%;">النقاط</th>
                    <th style="width: 25%;">حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- سيتم تعبئة الجدول هنا -->
            </tbody>
        </table>
    </div>
    <h3 id="total" style="margin-top: 15px;">إجمالي المشاركين: 0</h3>
</div>

        { name: "علي محمد الذييبي", points: 2 },
        { name: "محمد سعيد باعامر", points: 2 },
        { name: "عبدالرحمن سالم العليي", points: 2 },
        { name: "احمد محمد الشاطري", points: 2 }
    ];

    // --- 2. إعدادات الألوان ---
    const defaultColors = {
        'bg-page': '#0a192f', 'bg-table': '#112240', 'bg-row': '#0a192f',
        'bg-points': '#ffd700', 'text-main': '#ffffff', 'border-main': '#ffd700'
    };
    let currentColors = JSON.parse(localStorage.getItem('appColors')) || defaultColors;

    function applyColors() {
        for (let key in currentColors) {
            document.documentElement.style.setProperty(`--${key}`, currentColors[key]);
            const input = document.getElementById('c-' + key.split('-')[1]); 
            if(input) input.value = currentColors[key];
        }
    }
    function changeColor(variableName, color) {
        currentColors[variableName] = color;
        localStorage.setItem('appColors', JSON.stringify(currentColors));
        applyColors();
    }

    // --- 3. إدارة البيانات (تحديث جذري لمسح الكاش) ---
    // هذا السطر يقوم بمسح أي بيانات قديمة (مثل الأرقام 39 و 34) محفوظة في هاتفك
    localStorage.removeItem('appPlayers');
    
    // تحميل البيانات الجديدة النظيفة مباشرة
    let players = JSON.parse(JSON.stringify(initialData));
    localStorage.setItem('appPlayers', JSON.stringify(players));

    function saveData(showAlert = false) {
        localStorage.setItem('appPlayers', JSON.stringify(players));
        if(showAlert) alert('✅ تم حفظ جميع التعديلات بنجاح!');
    }

    function renderTable() {
        // الترتيب التلقائي من الأعلى للأقل
        players.sort((a, b) => b.points - a.points);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        players.forEach((player, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-size: 18px; color: var(--border-main);">${index + 1}</td>
                <td>
                    <input type="text" class="edit-input name-input" 
                           value="${player.name}" 
                           onchange="updatePlayer(${index}, 'name', this.value)">
                </td>
                <td>
                    <input type="number" class="edit-input points-input" 
                           value="${player.points}" 
                           onchange="updatePlayer(${index}, 'points', this.value)">
                </td>
                <td>
                    <button class="delete-btn" onclick="deletePlayer(${index})">✖</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('total').innerText = `إجمالي المشاركين: ${players.length}`;
    }

    function updatePlayer(index, field, newValue) {
        if (field === 'name') {
            if (newValue.trim() !== "") { players[index].name = newValue.trim(); } 
            else { renderTable(); return; }
        } else if (field === 'points') {
            let points = parseInt(newValue);
            if (isNaN(points)) points = 0; 
            players[index].points = points;
        }
        saveData();
        renderTable(); 
    }

    function deletePlayer(index) {
        if(confirm(`هل أنت متأكد من حذف (${players[index].name})؟`)) {
            players.splice(index, 1);
            saveData();
            renderTable();
        }
    }

    // --- 4. نظام الفرز والإضافة الذكي ---
    function cleanName(name) {
        return name.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
    }

    function parseNames() {
        const text = document.getElementById('bulkNames').value;
        if (!text.trim()) return alert('يرجى لصق الأسماء أولاً');

        const rawNames = text.split(/[،,\n]+/);
        const parsedItemsContainer = document.getElementById('parsedItems');
        parsedItemsContainer.innerHTML = '';
        let validNamesCount = 0;

        rawNames.forEach(rawName => {
            let clean = cleanName(rawName);
            if (clean.length > 2) { 
                validNamesCount++;
                const div = document.createElement('div');
                div.className = 'parsed-item';
                div.innerHTML = `
                    <span>${clean}</span>
                    <input type="number" class="item-points" data-name="${clean}" placeholder="النقاط">
                `;
                parsedItemsContainer.appendChild(div);
            }
        });

        if (validNamesCount > 0) {
            document.getElementById('parsedContainer').style.display = 'block';
        } else {
            alert('لم يتم التعرف على أي أسماء صالحة.');
        }
    }

    function applyParsedNames() {
        const defaultPointsInput = document.getElementById('defaultPoints').value;
        const defaultPoints = parseInt(defaultPointsInput) || 0;
        
        const inputs = document.querySelectorAll('.item-points');
        let added = 0, updated = 0;

        inputs.forEach(input => {
            const name = input.getAttribute('data-name');
            let points = input.value.trim() !== "" ? parseInt(input.value) : defaultPoints;
            if (isNaN(points)) points = 0;

            const existing = players.find(p => p.name === name);
            if (existing) {
                existing.points += points; 
                updated++;
            } else {
                players.push({ name: name, points: points }); 
                added++;
            }
        });

        document.getElementById('parsedContainer').style.display = 'none';
        document.getElementById('bulkNames').value = '';
        
        saveData();
        renderTable();
        
        alert(`✅ تم الاعتماد بنجاح!\nأسماء جديدة: ${added}\nأسماء مكررة تم تحديثها: ${updated}`);
    }

    function addName() {
        const nameInput = document.getElementById('inputName');
        const pointsInput = document.getElementById('inputPoints');
        let name = nameInput.value.trim();
        const points = parseInt(pointsInput.value) || 0;

        if (!name) return alert('يرجى كتابة الاسم');
        name = cleanName(name);

        const existing = players.find(p => p.name === name);
        if (existing) { existing.points += points; } 
        else { players.push({ name: name, points: points }); }
        
        nameInput.value = '';
        pointsInput.value = '0';
        saveData();
        renderTable();
    }

    function resetPoints() {
        if(confirm('هل أنت متأكد من تصفير جميع النقاط؟ (ستبقى الأسماء في القائمة)')) {
            players.forEach(p => p.points = 0);
            saveData();
            renderTable();
        }
    }

    function clearAll() {
        if(confirm('هل تريد مسح جميع الأسماء والبيانات نهائياً؟')) {
            players = [];
            saveData();
            renderTable();
        }
    }

    function shareWhatsApp() {
        if(players.length === 0) return alert('لا توجد بيانات');
        let text = "🏆 *ترتيب التوقعات* 🏆\n\n";
        players.forEach((p, i) => {
            text += `${i + 1}- ${p.name} : *${p.points}* نقطة\n`;
        });
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
        applyColors();
        renderTable();
    });
</script>
</body>
</html>
