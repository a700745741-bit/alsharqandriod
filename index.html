<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدى العندليب - إدارة التوقعات</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* المتغيرات الافتراضية */
        :root {
            --bg-page: #0a192f;
            --bg-table: #112240;
            --bg-row: #0a192f;
            --bg-points: #ffd700;
            --text-main: #ffffff;
            --border-main: #ffd700;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-table);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid var(--border-main);
        }
        h1, h2, h3 { text-align: center; color: var(--border-main); margin-top: 5px; }
        
        .box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-main);
        }

        /* تنسيق الأزرار */
        .btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            width: 100%;
            margin-top: 5px;
        }
        .btn-green { background-color: #28a745; }
        .btn-gold { background-color: #ffd700; color: #000; }
        .btn-blue { background-color: #007bff; }
        .btn-red { background-color: #dc3545; }
        .btn-purple { background-color: #6f42c1; }

        /* حقول الإدخال العلوية */
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .flex-row { display: flex; gap: 5px; }
        .flex-row input { flex: 1; }

        /* لوحة الألوان */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .color-box {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .color-box label { display: block; font-size: 12px; margin-bottom: 5px; }
        .color-box input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; }

        /* تصميم الجدول */
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: var(--bg-table);
        }
        th { 
            background-color: var(--bg-table); 
            color: var(--border-main); 
            padding: 10px; 
            border-bottom: 2px solid var(--border-main); 
        }
        td { 
            padding: 5px; 
            border-bottom: 1px solid var(--border-main); 
            font-weight: bold; 
            background-color: var(--bg-row);
            color: var(--text-main);
        }
        
        /* حقول التعديل المباشرة داخل الجدول */
        .edit-input {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            font-family: inherit;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            padding: 8px 2px;
            margin: 0;
            box-sizing: border-box;
            outline: none;
            border-radius: 5px;
        }
        /* إظهار الإطار عند الضغط لتوضيح إمكانية التعديل */
        .edit-input:focus {
            border-color: var(--border-main);
            background: rgba(255,255,255,0.1);
        }
        .name-input {
            text-align: right;
            font-size: 16px;
        }
        .points-input {
            background-color: var(--bg-points);
            color: #000;
            font-size: 18px;
            text-align: center;
            font-weight: 900;
        }
        
        /* أزرار الحذف */
        .action-btn { 
            border: none; border-radius: 5px; width: 35px; height: 35px; 
            font-size: 16px; cursor: pointer; color: white;
            background-color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>صدى العندليب</h1>

    <!-- 1. لوحة التحكم بالألوان -->
    <div class="box" style="border-color: #6f42c1;">
        <h3 style="color: #6f42c1;">🎨 تغيير الألوان</h3>
        <div class="color-grid">
            <div class="color-box">
                <label>خلفية الصفحة</label>
                <input type="color" id="c-page" onchange="changeColor('bg-page', this.value)">
            </div>
            <div class="color-box">
                <label>خلفية الجدول</label>
                <input type="color" id="c-table" onchange="changeColor('bg-table', this.value)">
            </div>
            <div class="color-box">
                <label>خلفية الصفوف</label>
                <input type="color" id="c-row" onchange="changeColor('bg-row', this.value)">
            </div>
            <div class="color-box">
                <label>مربع النقاط</label>
                <input type="color" id="c-points" onchange="changeColor('bg-points', this.value)">
            </div>
            <div class="color-box">
                <label>لون النص</label>
                <input type="color" id="c-text" onchange="changeColor('text-main', this.value)">
            </div>
            <div class="color-box">
                <label>لون الإطار</label>
                <input type="color" id="c-border" onchange="changeColor('border-main', this.value)">
            </div>
        </div>
    </div>

    <!-- 2. إضافة اسم واحد -->
    <div class="box">
        <h3>➕ إضافة اسم ونقاط</h3>
        <div class="flex-row">
            <input type="text" id="inputName" placeholder="اسم المشترك">
            <input type="number" id="inputPoints" placeholder="النقاط" value="0">
        </div>
        <button class="btn btn-gold" onclick="addName()">إضافة للقائمة</button>
    </div>

    <!-- 3. إضافة توقعات صحيحة (لصق) -->
    <div class="box">
        <h3>✅ لصق أسماء (توقعات صحيحة)</h3>
        <textarea id="bulkNames" placeholder="كل اسم في سطر..."></textarea>
        <div class="flex-row">
            <input type="number" id="bulkPoints" placeholder="النقاط المضافة" value="3">
            <button class="btn btn-green" onclick="addBulk()">إضافة وترتيب</button>
        </div>
    </div>

    <!-- 4. أزرار الحفظ والمشاركة -->
    <div class="box" style="text-align: center;">
        <button class="btn btn-green" style="margin-bottom: 5px;" onclick="saveData()">💾 حفظ التعديلات نهائياً</button>
        <button class="btn btn-blue" style="margin-bottom: 5px;" onclick="shareWhatsApp()">📱 مشاركة عبر واتساب</button>
        <button class="btn btn-red" onclick="clearAll()">🗑️ مسح جميع الأسماء</button>
    </div>

    <!-- 5. الجدول -->
    <h3 style="font-size: 13px; color: #aaa; margin-bottom: 5px;">💡 اضغط مباشرة على خانة الاسم أو خانة النقاط (المربع الأصفر) لتعديلها، ثم اضغط Enter.</h3>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">#</th>
                    <th style="width: 50%;">الاسم</th>
                    <th style="width: 25%;">النقاط</th>
                    <th style="width: 15%;">حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- سيتم تعبئة الجدول هنا -->
            </tbody>
        </table>
    </div>
    <h3 id="total" style="margin-top: 15px;">إجمالي المشاركين: 0</h3>
</div>

<script>
    // --- 1. إعدادات الألوان ---
    const defaultColors = {
        'bg-page': '#0a192f',
        'bg-table': '#112240',
        'bg-row': '#0a192f',
        'bg-points': '#ffd700',
        'text-main': '#ffffff',
        'border-main': '#ffd700'
    };

    let currentColors = JSON.parse(localStorage.getItem('appColors')) || defaultColors;

    function applyColors() {
        for (let key in currentColors) {
            document.documentElement.style.setProperty(`--${key}`, currentColors[key]);
            const input = document.getElementById('c-' + key.split('-')[1]); 
            if(input) input.value = currentColors[key];
        }
    }

    function changeColor(variableName, color) {
        currentColors[variableName] = color;
        localStorage.setItem('appColors', JSON.stringify(currentColors));
        applyColors();
    }

    // --- 2. إدارة البيانات ---
    let players = JSON.parse(localStorage.getItem('appPlayers')) || [];

    // دالة الحفظ في الخلفية
    function saveData() {
        localStorage.setItem('appPlayers', JSON.stringify(players));
    }

    // دالة عرض الجدول (تستخدم حقول إدخال مباشرة)
    function renderTable() {
        // الترتيب التلقائي (من الأعلى للأقل)
        players.sort((a, b) => b.points - a.points);
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        players.forEach((player, index) => {
            const tr = document.createElement('tr');
            
            // وضع البيانات داخل حقول input لتكون قابلة للتعديل المباشر
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>
                    <input type="text" class="edit-input name-input" 
                           value="${player.name}" 
                           onchange="updatePlayer(${index}, 'name', this.value)">
                </td>
                <td>
                    <input type="number" class="edit-input points-input" 
                           value="${player.points}" 
                           onchange="updatePlayer(${index}, 'points', this.value)">
                </td>
                <td>
                    <button class="action-btn" onclick="deletePlayer(${index})">✖</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('total').innerText = `إجمالي المشاركين: ${players.length}`;
    }

    // دالة التحديث المباشر عند الكتابة في الحقل
    function updatePlayer(index, field, newValue) {
        if (field === 'name') {
            if (newValue.trim() !== "") {
                players[index].name = newValue.trim();
            } else {
                renderTable(); // إعادة الاسم القديم إذا تم مسحه
                return;
            }
        } else if (field === 'points') {
            let points = parseInt(newValue);
            if (isNaN(points)) points = 0; 
            players[index].points = points;
        }
        
        // حفظ البيانات في الخلفية وإعادة ترتيب الجدول فوراً
        saveData();
        renderTable(); 
    }

    // --- 3. الوظائف الأخرى ---

    // إضافة اسم يدوي
    function addName() {
        const nameInput = document.getElementById('inputName');
        const pointsInput = document.getElementById('inputPoints');
        const name = nameInput.value.trim();
        const points = parseInt(pointsInput.value) || 0;

        if (!name) return alert('يرجى كتابة الاسم');

        const existing = players.find(p => p.name === name);
        if (existing) {
            existing.points += points;
        } else {
            players.push({ name: name, points: points });
        }
        
        nameInput.value = '';
        pointsInput.value = '0';
        saveData();
        renderTable();
    }

    // حذف لاعب
    function deletePlayer(index) {
        if(confirm(`هل أنت متأكد من حذف (${players[index].name})؟`)) {
            players.splice(index, 1);
            saveData();
            renderTable();
        }
    }

    // إضافة جماعية
    function addBulk() {
        const text = document.getElementById('bulkNames').value;
        const points = parseInt(document.getElementById('bulkPoints').value) || 0;
        if (!text.trim()) return alert('يرجى لصق الأسماء أولاً');

        const names = text.split('\n').map(n => n.trim()).filter(n => n !== '');
        
        names.forEach(name => {
            const existing = players.find(p => p.name === name);
            if (existing) {
                existing.points += points;
            } else {
                players.push({ name: name, points: points });
            }
        });

        document.getElementById('bulkNames').value = '';
        saveData();
        renderTable();
        alert('تمت الإضافة والترتيب بنجاح');
    }

    // مسح الكل
    function clearAll() {
        if(confirm('هل تريد مسح جميع البيانات نهائياً؟')) {
            players = [];
            saveData();
            renderTable();
        }
    }

    // مشاركة واتساب
    function shareWhatsApp() {
        if(players.length === 0) return alert('لا توجد بيانات');
        let text = "🏆 *ترتيب التوقعات* 🏆\n\n";
        players.forEach((p, i) => {
            text += `${i + 1}- ${p.name} : *${p.points}* نقطة\n`;
        });
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // تشغيل النظام عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', () => {
        applyColors();
        renderTable();
    });
</script>
</body>
</html>
